*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column}

.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7db2ff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.brand .name{font-weight:680;font-size:15px}
.brand .name b{color:var(--accent)}

.nav-group{font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding:14px 12px 7px;font-weight:650}

.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.main{flex:1;margin-left:var(--sidebar-w);min-width:0}
.header{height:var(--header-h);position:sticky;top:0;z-index:30;background:rgba(17,22,31,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px}
.content{padding:18px 20px 32px}

.top-bar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.top-bar .page-title{font-size:21px;font-weight:700}
.top-bar .stats{font-size:12.5px;color:var(--fg-2)}
.top-bar .stats b{color:var(--fg);font-weight:650;font-family:var(--font-mono)}

.stb{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:8px;width:fit-content;flex-shrink:0;margin-bottom:14px}
.stb a{padding:5px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--fg-2);cursor:pointer;border:none;background:transparent;transition:.12s;font-family:var(--font-sans);text-decoration:none;display:inline-block}
.stb a:hover{color:var(--fg)}
.stb a.on{background:var(--accent-dim);color:var(--accent);font-weight:650}

.filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-pill{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);font-size:12.5px;cursor:pointer;transition:.12s}
.filter-pill:hover{background:var(--surface-2);color:var(--fg)}
.filter-pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}

.sort-bar{display:flex;gap:8px;margin-bottom:16px}
.sort-btn{font-size:11px;padding:4px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);cursor:pointer;transition:.12s;font-family:var(--font-sans)}

.sort-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}

.accordion-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

.str-row:hover{background:var(--surface-2)}

.str-row.active .sr-arrow{color:var(--accent)}

.str-row .sr-name{flex:1;min-width:90px;font-weight:600}
.str-row .sr-type{width:56px;flex-shrink:0;font-size:10px}

.str-row .sr-annual{width:64px;flex-shrink:0;font-family:var(--font-mono);font-weight:650;text-align:right}
.str-row .sr-drawdown{width:64px;flex-shrink:0;font-family:var(--font-mono);text-align:right;color:var(--down)}
.str-row .sr-sharpe{width:48px;flex-shrink:0;font-family:var(--font-mono);text-align:right}
.str-row .sr-winrate{width:48px;flex-shrink:0;font-family:var(--font-mono);text-align:right;font-weight:600}
.str-row .sr-source{width:66px;flex-shrink:0;font-size:10px;color:var(--fg-2);text-align:center}

.str-detail{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--surface-2)}

.detail-inner{padding:18px 16px 16px}

.detail-header{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.detail-code{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:650}
.detail-name{font-size:16px;font-weight:700}
.detail-source{font-size:11px;color:var(--fg-2);margin-left:2px}

.detail-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px}
.detail-m-card{background:var(--surface);padding:12px 10px;text-align:center}
.detail-m-label{font-size:10px;color:var(--muted);margin-bottom:4px}

.detail-chart-wrap{width:100%;height:280px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:14px}

.detail-actions{display:flex;gap:8px;flex-wrap:wrap}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:420px;max-width:95vw}

function getFilteredSorted(){
  var filtered = strategies;
  if(currentFilter !== 'all'){
    filtered = strategies.filter(function(s){return s.source===currentFilter;});
  }
  return filtered.slice().sort(function(a,b){
    if(currentSort==='annualReturn') return b.annualReturn - a.annualReturn;
    if(currentSort==='sharpeRatio') return b.sharpeRatio - a.sharpeRatio;
    return b.winRate - a.winRate;
  });
}

function formatDate(d){
  var p = d.split('-');
  return p[1]+'-'+p[2];
}

function renderRows(){
  var sorted = getFilteredSorted();
  var container = document.getElementById('accordionBody');
  var html = '';
  for(var i=0;i<sorted.length;i++){
    var s = sorted[i];
    var isExpanded = expandedId === s.id;
    html += '<div class="accordion-item" data-id="'+s.id+'">'+
      '<div class="str-row'+(isExpanded?' active':'')+'" onclick="toggleItem(\''+s.id+'\')">'+
        '<span class="sr-arrow">'+(isExpanded?'▼':'▶')+'</span>'+
        '<span class="sr-code">'+s.code+'</span>'+
        '<span class="sr-name">'+s.name+'</span>'+
        '<span class="sr-type"><span class="badge">'+s.typeLabel+'</span></span>'+
        '<span class="sr-annual" style="color:'+(s.annualReturn>0?'var(--up)':'var(--down)')+'">'+(s.annualReturn>0?'+':'')+(s.annualReturn*100).toFixed(1)+'%</span>'+
        '<span class="sr-drawdown">'+(s.maxDrawdown*100).toFixed(1)+'%</span>'+
        '<span class="sr-sharpe">'+s.sharpeRatio.toFixed(2)+'</span>'+
        '<span class="sr-winrate">'+(s.winRate*100).toFixed(0)+'%</span>'+
        '<span class="sr-source">'+s.sourceLabel+'</span>'+
      '</div>'+
      '<div class="str-detail'+(isExpanded?' open':'')+'">'+
        '<div class="detail-inner">'+
          '<div class="detail-header">'+
            '<span class="detail-code">'+s.code+'</span>'+
            '<span class="detail-name">'+s.name+'</span>'+
            '<span class="detail-source">· '+s.sourceLabel+'</span>'+
          '</div>'+
          '<div class="detail-metrics">'+
            '<div class="detail-m-card"><div class="detail-m-label">年化收益</div><div class="detail-m-value" style="color:'+(s.annualReturn>0?'var(--up)':'var(--down)')+'">'+(s.annualReturn>0?'+':'')+(s.annualReturn*100).toFixed(1)+'%</div></div>'+
            '<div class="detail-m-card"><div class="detail-m-label">最大回撤</div><div class="detail-m-value" style="color:var(--down)">'+(s.maxDrawdown*100).toFixed(1)+'%</div></div>'+
            '<div class="detail-m-card"><div class="detail-m-label">夏普比率</div><div class="detail-m-value" style="color:var(--accent)">'+s.sharpeRatio.toFixed(2)+'</div></div>'+
            '<div class="detail-m-card"><div class="detail-m-label">胜率</div><div class="detail-m-value">'+(s.winRate*100).toFixed(0)+'%</div></div>'+
            '<div class="detail-m-card"><div class="detail-m-label">运行人数</div><div class="detail-m-value">'+s.runnerCount.toLocaleString()+'</div></div>'+
            '<div class="detail-m-card"><div class="detail-m-label">创建日期</div><div class="detail-m-value" style="font-size:12px">'+formatDate(s.createDate)+'</div></div>'+
          '</div>'+
          '<div class="detail-params">'+
            '<b>⚙️ 核心参数</b> &nbsp;选股: '+s.selectionMethod+' | 止损'+s.stopLoss+'% | 止盈'+s.takeProfit+'% | 单票上限'+s.singleStockPct+'%'+
          '</div>'+
          '<div class="detail-portfolio">'+
            '<div class="detail-portfolio-header">📦 投资组合 ('+s.portfolioSummary.count+'只)</div>'+
            '<table class="detail-pf-table"><thead><tr><th>代码</th><th>名称</th><th style="text-align:right">权重</th><th style="text-align:right">止损</th><th style="text-align:right">止盈</th></tr></thead><tbody>'+
            s.stocks.map(function(st){
              var override = (st.stop !== s.stopLoss || st.profit !== s.takeProfit) ? '<span class="pf-override">← 覆盖</span>' : '';
              return '<tr><td class="pf-code">'+st.code+'</td><td class="pf-name">'+st.name+'</td><td class="pf-w">'+st.weight+'%</td><td class="pf-sl">'+st.stop.toFixed(1)+'%'+override+'</td><td class="pf-tp">'+st.profit.toFixed(1)+'%</td></tr>';
            }).join('')+
            '</tbody></table>'+
          '</div>'+
          '<div class="detail-chart-wrap"><div class="detail-chart" id="chart-'+s.id+'" style="width:100%;height:280px"></div></div>'+
          '<div class="detail-actions">'+
            '<button class="primary" onclick="event.stopPropagation();openFollow(\''+s.code+'\','+s.stopLoss+','+s.takeProfit+','+s.annualReturn+')">🚀 一键跟单</button>'+
            '<button onclick="event.stopPropagation();showToast(\'📋 跳转策略配置: '+s.name+'\')">📋 查看完整配置</button>'+
            '<button onclick="event.stopPropagation();showToast(\'📊 跳转回测详情: '+s.name+'\')">📊 回测详情</button>'+
            '<button onclick="event.stopPropagation();showToast(\'📦 组合详情: '+s.name+'\')">📦 完整明细</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  container.innerHTML = html;
  document.getElementById('countLabel').textContent = sorted.length;

  if(expandedId){
    requestAnimationFrame(function(){
      renderChart(expandedId);
    });
  }
}

function renderChart(id){
  var chartDom = document.getElementById('chart-'+id);
  if(!chartDom) return;
  if(chartDom._echart){ chartDom._echart.dispose(); }
  var s = strategies.find(function(st){return st.id===id;});
  if(!s) return;
  var myChart = echarts.init(chartDom);
  chartDom._echart = myChart;
  var option = {
    grid:{left:8,right:16,top:12,bottom:8,containLabel:false},
    xAxis:{type:'category',data:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],axisLine:{lineStyle:{color:'var(--border)'}},axisTick:{show:false},axisLabel:{fontSize:9,color:'var(--muted)',interval:2}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'var(--border)'}},axisLabel:{fontSize:9,color:'var(--muted)',formatter:function(v){return (v*100).toFixed(0)+'%'}}},
    series:[{
      data:s.navData, type:'line', smooth:true,
      symbol:'none',
      lineStyle:{color:'#3d8bff',width:2},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0,color:'rgba(61,139,255,0.22)'},
        {offset:1,color:'rgba(61,139,255,0.02)'}
      ])}
    }]
  };
  myChart.setOption(option);
}

function disposeChart(id){
  var chartDom = document.getElementById('chart-'+id);
  if(chartDom && chartDom._echart){
    chartDom._echart.dispose();
    chartDom._echart = null;
  }
}

function toggleItem(id){
  if(expandedId === id){
    disposeChart(id);
    expandedId = null;
    renderRows();
    return;
  }
  if(expandedId){
    disposeChart(expandedId);
  }
  expandedId = id;
  renderRows();
}

function filterSource(src, btn){
  document.querySelectorAll('.filter-pill').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  currentFilter = src;
  if(expandedId){ disposeChart(expandedId); expandedId = null; }
  renderRows();
}

function sortBy(field, btn){
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentSort = field;
  if(expandedId){ disposeChart(expandedId); expandedId = null; }
  renderRows();
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  clearTimeout(t._tid);t._tid=setTimeout(function(){t.className='toast';},2200);
}

function openFollow(code, stopLoss, takeProfit, annualReturn){
  followStopLoss=stopLoss/100; followTakeProfit=takeProfit/100;
  followStrategyCode = code;
  document.getElementById('followTitle').textContent='🚀 一键跟单: '+code;
  document.getElementById('followDesc').textContent='年化收益: '+(annualReturn>0?'+':'')+(annualReturn*100).toFixed(1)+'%';
  document.getElementById('followStop').textContent='• 止损 '+stopLoss+'% 自动卖出';
  document.getElementById('followProfit').textContent='• 止盈 '+takeProfit+'% 自动卖出';
  document.getElementById('followModal').classList.add('show');
  updateLoss();
}

function closeFollow(){
  document.getElementById('followModal').classList.remove('show');
}

function updateLoss(){
  var amt=parseFloat(document.getElementById('followAmount').value.replace(/,/g,''))||100000;
  var loss=(amt*followStopLoss).toLocaleString();
  document.getElementById('lossHint').textContent='最大亏损: 约 ¥'+loss+' ('+((followStopLoss*100).toFixed(0))+'%)';
}

function confirmFollow(){
  closeFollow();
  showToast('已创建策略副本 FORK-'+followStrategyCode+'，跳转策略监控...');
}

function openFollowDetail(){
  closeFollow();
  showToast('📋 跳转策略配置 · 开发中');
}

renderRows();

window.addEventListener('resize', function(){
  if(expandedId){
    var chartDom = document.getElementById('chart-'+expandedId);
    if(chartDom && chartDom._echart){ chartDom._echart.resize(); }
  }
});
</script>
<script src="assets/preview-interactions.js"></script>
</body>
</html>
