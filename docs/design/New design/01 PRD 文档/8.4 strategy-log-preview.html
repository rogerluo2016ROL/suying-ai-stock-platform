<style class="legacy-page-style">
.log-wrap{max-width:860px;margin:0 auto}
.log-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.log-top .sel-label{font-size:12px;color:var(--fg-2)}
.log-top select{padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;color:var(--fg);font-size:13px;outline:none;min-width:280px}
.log-top select:focus{border-color:var(--accent)}
.log-top .export-btn{margin-left:auto;padding:7px 16px;border-radius:5px;border:1px solid var(--border);background:var(--elevated);color:var(--fg-2);cursor:pointer;font-size:12px;font-weight:500;transition:.12s;font-family:var(--font-sans)}
.log-top .export-btn:hover{background:var(--surface);color:var(--fg)}
.log-top .log-count{font-size:11px;color:var(--muted)}

.log-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.log-pill{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);font-size:11.5px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:4px}
.log-pill:hover{background:var(--surface-2);color:var(--fg)}
.log-pill.active{font-weight:600}
.log-pill.active.all{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.log-pill.active.order{background:rgba(61,139,255,.10);border-color:var(--accent);color:var(--accent)}
.log-pill.active.stop-loss{background:var(--up-bg);border-color:var(--up);color:var(--up)}
.log-pill.active.take-profit{background:var(--down-bg);border-color:var(--down);color:var(--down)}
.log-pill.active.pause{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.log-pill.active.info{background:rgba(94,106,125,.15);border-color:var(--muted);color:var(--fg)}
.log-pill.active.error{background:rgba(255,77,79,.15);border-color:var(--up);color:var(--up)}
.log-pill .pill-count{font-family:var(--font-mono);font-size:9.5px;opacity:.7}

.log-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.log-th{display:flex;padding:6px 12px;font-size:9.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);gap:8px;align-items:center}
.log-row{display:flex;padding:7px 12px;font-size:10.5px;border-bottom:1px solid var(--border);gap:8px;align-items:center;transition:.12s;cursor:pointer}
.log-row:hover{background:var(--surface-2)}
.log-row:last-child{border-bottom:none}
.log-row.expanded{background:var(--surface-2)}
.log-row .lr-time{font-family:var(--font-mono);width:44px;flex-shrink:0;color:var(--muted);font-size:10px}
.log-row .lr-event{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-row .lr-detail{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2);font-size:10px}

.log-expand-row{display:none;padding:8px 12px 8px 120px;font-size:10px;color:var(--fg-2);line-height:1.6;border-bottom:1px solid var(--border);background:rgba(0,0,0,.08)}
.log-row.expanded+.log-expand-row{display:block}

.log-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:650;flex-shrink:0;width:64px;justify-content:center}
.log-badge.order{background:rgba(61,139,255,.10);color:var(--accent)}
.log-badge.stop-loss{background:var(--up-bg);color:var(--up);border:1px solid rgba(255,77,79,.15)}
.log-badge.take-profit{background:var(--down-bg);color:var(--down);border:1px solid rgba(46,194,126,.15)}
.log-badge.pause{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(245,166,35,.15)}
.log-badge.info{background:rgba(94,106,125,.10);color:var(--muted)}
.log-badge.error{background:rgba(255,77,79,.15);color:var(--up);border:1px solid rgba(255,77,79,.25);font-weight:700}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .es-icon{font-size:40px;margin-bottom:12px}
.empty-state .es-text{font-size:14px;font-weight:600;margin-bottom:6px}
.empty-state .es-hint{font-size:11px}

@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(46,194,126,.5)}70%{box-shadow:0 0 0 5px rgba(46,194,126,0)}100%{box-shadow:0 0 0 0 rgba(46,194,126,0)}}

var currentLogFilter = 'all';

/* 跟单/部署副本（8.1/8.2 写入 localStorage）合并进策略列表 */
function loadFollows(){
  var follows = [];
  try{ follows = JSON.parse(localStorage.getItem('suying_mock_follows')||'[]'); }catch(e){}
  var sel = document.getElementById('strategySelect');
  follows.forEach(function(f){
    if(logsData[f.code]) return;
    logsData[f.code] = { label:(f.name || '跟单副本'), status:'running', logs:[
      {time:'09:30', type:'info', event:'策略部署完成', detail:'跟单金额 ¥'+(f.amount?Math.round(f.amount).toLocaleString():'100,000'), expand:'副本编码: '+f.code+' · 来源: 策略广场一键跟单 · 执行器已就绪'}
    ]};
    var opt = document.createElement('option');
    opt.value = f.code;
    opt.textContent = f.code + ' ' + (f.name || '跟单副本');
    sel.appendChild(opt);
  });
}

function renderLogs(id){
  var d = logsData[id];
  var body = document.getElementById('logBody');
  var html = '';
  d.logs.forEach(function(l){
    html += '<div class="log-row" data-type="'+l.type+'" onclick="toggleExpand(this)">'+
      '<span class="lr-time">'+l.time+'</span>'+
      '<span class="log-badge '+l.type+'">'+TYPE_META[l.type].label+'</span>'+
      '<span class="lr-event">'+l.event+'</span>'+
      '<span class="lr-detail">'+l.detail+'</span>'+
    '</div>'+
    '<div class="log-expand-row">'+l.expand+'</div>';
  });
  body.innerHTML = html;

  /* 计数：pill + 顶部统计（HH:MM 格式视为今日） */
  var counts = {all:d.logs.length};
  var today = 0;
  d.logs.forEach(function(l){
    counts[l.type] = (counts[l.type]||0) + 1;
    if(/^\d{2}:\d{2}$/.test(l.time)) today++;
  });
  document.querySelectorAll('.log-pill').forEach(function(p){
    var t = p.dataset.type;
    var c = p.querySelector('.pill-count');
    if(c) c.textContent = counts[t] || 0;
  });
  document.getElementById('logCount').innerHTML = '共<b>'+d.logs.length+'</b>条记录 · 今日<b>'+today+'</b>条';

  applyLogFilter();
}

function applyLogFilter(){
  var type = currentLogFilter;
  var visible = 0;
  document.querySelectorAll('#logBody .log-row').forEach(function(r){
    var show = type==='all' || r.dataset.type===type;
    r.style.display = show ? '' : 'none';
    if(!show) r.classList.remove('expanded');
    var next = r.nextElementSibling;
    if(next && next.classList.contains('log-expand-row')){
      next.style.display = r.style.display;
    }
    if(show) visible++;
  });
  document.getElementById('logEmpty').style.display = visible ? 'none' : '';
}

function switchStrategy(id){
  var d = logsData[id];
  var badge = document.getElementById('statusBadge');
  if(d.status === 'running'){
    badge.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:var(--down);animation:dotPulse 1.8s infinite"></span>运行中';
    badge.style.background = 'var(--down-bg)';
    badge.style.color = 'var(--down)';
    badge.style.border = '1px solid rgba(46,194,126,.25)';
  } else {
    badge.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:var(--warn)"></span><span style="color:var(--warn)">已暂停</span>';
    badge.style.background = 'var(--warn-bg)';
    badge.style.color = 'var(--warn)';
    badge.style.border = '1px solid rgba(245,166,35,.25)';
  }
  renderLogs(id);
  suyingToast('📜 已加载策略 '+id+' '+d.label+' 的日志','success');
}

function filterLogs(type,btn){
  document.querySelectorAll('.log-pill').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.log-pill').forEach(function(p){ p.classList.remove('all','order','stop-loss','take-profit','pause','info','error'); });
  btn.classList.add('active');
  btn.classList.add(type);
  currentLogFilter = type;
  applyLogFilter();
}

function toggleExpand(row){
  row.classList.toggle('expanded');
}

function exportLogs(){
  var id = document.getElementById('strategySelect').value;
  var rows=document.querySelectorAll('#logBody .log-row');
  var csv='时间,级别,事件,详情\n';
  var n = 0;
  rows.forEach(function(r){
    if(r.style.display==='none')return;
    var time=r.querySelector('.lr-time').textContent;
    var badge=r.querySelector('.log-badge').textContent.trim();
    var event=r.querySelector('.lr-event').textContent;
    var detail=r.querySelector('.lr-detail').textContent;
    csv+='"'+time+'","'+badge+'","'+event+'","'+detail+'"\n';
    n++;
  });
  if(n === 0){
    suyingToast('⚠️ 当前筛选下没有可导出的日志','warn');
    return;
  }
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='策略日志_'+id+'_2026-06-27.csv';
  a.click();
  URL.revokeObjectURL(url);
  suyingToast('📥 日志已导出 · '+n+'条记录','success');
}

  var id = document.getElementById('strategySelect').value;
  var d = logsData[id];
  var badge = document.getElementById('statusBadge');
  if(d.status !== 'running'){
    badge.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:var(--warn)"></span><span style="color:var(--warn)">已暂停</span>';
    badge.style.background = 'var(--warn-bg)';
    badge.style.color = 'var(--warn)';
    badge.style.border = '1px solid rgba(245,166,35,.25)';
  }
  renderLogs(id);
})();
</script>
