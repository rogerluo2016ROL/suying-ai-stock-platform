<!doctype html>

<head>

<script src="assets/echarts.min.js"></script>
<style class="legacy-page-style">
/* Layout overrides（本页为整屏 flex 布局，覆盖 app.css 壳样式） */
.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;height:100vh}
.content{flex:1;display:flex;flex-direction:column;padding:16px 20px 0;overflow:hidden}

/* QuickSelectBar */
.qsb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);flex-shrink:0;flex-wrap:wrap}
.qsb .qsb-label{font-size:10.5px;color:var(--muted);white-space:nowrap}
.qsb .qsb-chips{display:flex;gap:6px;flex-wrap:wrap}
.qsc{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:11px;transition:.12s}
.qsc:hover{background:var(--elevated);border-color:var(--border-2)}
.qsc.active{background:var(--accent-dim);border-color:var(--accent)}
.qsc .n{font-weight:600;color:var(--fg)}
.qsc .c{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
.qsb input{padding:3px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-family:var(--font-mono);font-size:11px;outline:none;width:130px}
.qsb input:focus{border-color:var(--accent)}
.qsb input::placeholder{color:var(--muted);font-family:var(--font-sans)}

/* Pill SubTabBar */
.stb{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:8px;width:fit-content;flex-shrink:0;margin:10px 0}
.stb a{padding:5px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--fg-2);cursor:pointer;border:none;background:transparent;transition:.12s;font-family:var(--font-sans);text-decoration:none;display:inline-block}
.stb a:hover{color:var(--fg)}
.stb a.on{background:var(--accent-dim);color:var(--accent);font-weight:650}

/* Main Row */
.sm{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
.sl{flex:60;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sr{flex:40;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sl::-webkit-scrollbar,.sr::-webkit-scrollbar{width:4px}
.sl::-webkit-scrollbar-thumb,.sr::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px}

/* History Chart */
#history-chart{width:100%;height:360px}

/* Hit Rate */
.hit{display:flex;gap:14px}
.hc{flex:1;background:var(--surface-2);border-radius:var(--radius);padding:14px;text-align:center}
.hc .hl{font-size:13px;font-weight:650;margin-bottom:8px}
.hc .hm{font-size:11px;color:var(--fg-2);line-height:1.7}
.hc .hm b{font-family:var(--font-mono);font-weight:650}
.hs{margin-top:14px;padding:10px 14px;background:var(--surface-2);border-radius:6px;font-size:11px;color:var(--fg-2);text-align:center}

/* Quick Action Bar */
.qa{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--border);margin-top:auto;flex-shrink:0}
.qa button{flex:1;text-align:center;font-size:11.5px;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--elevated);color:var(--fg-2);cursor:pointer;transition:.12s;font-family:var(--font-sans)}
.qa button:hover{background:var(--surface);color:var(--fg)}
.qa button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.qa button.primary:hover{background:#2d7ae0}
</style>
<link rel="stylesheet" href="assets/app.css" />
<link rel="stylesheet" href="assets/preview-adapter.css" />
</head>
<body class="legacy-preview" data-page="signals" data-title="交易信号 — 信号历史">
<div class="app">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="header-mount"></div>
    <main class="content">
<!-- QuickSelectBar -->
                <div class="qsb">
                  <span class="qsb-label">候选池:</span>
                  <div class="qsb-chips">
                    <span class="qsc active" onclick="switchStock('宁德时代','300750',this)"><span class="n">宁德时代</span><span class="c">300750</span></span>
                    <span class="qsc" onclick="switchStock('中芯国际','688981',this)"><span class="n">中芯国际</span><span class="c">688981</span></span>
                    <span class="qsc" onclick="switchStock('北方华创','002371',this)"><span class="n">北方华创</span><span class="c">002371</span></span>
                  </div>
                  <span class="qsb-label" style="margin-left:8px">自选:</span>
                  <div class="qsb-chips">
                    <span class="qsc" onclick="switchStock('贵州茅台','600519',this)"><span class="n">贵州茅台</span><span class="c">600519</span></span>
                    <span class="qsc" onclick="switchStock('平安银行','000001',this)"><span class="n">平安银行</span><span class="c">000001</span></span>
                  </div>
                  <span class="qsb-label" style="margin-left:8px">最近:</span>
                  <div class="qsb-chips">
                    <span class="qsc" onclick="switchStock('比亚迪','002594',this)"><span class="n">比亚迪</span><span class="c">002594</span></span>
                  </div>
                  <input type="text" id="qsb-search" placeholder="搜索代码/名称..." style="margin-left:auto">
                </div>
<!-- History Content -->
                <div class="sm" style="flex:1">
                  <!-- Left: Chart -->
                  <div class="sl">
                    <div class="card" style="flex:1;display:flex;flex-direction:column">
                      <div class="card-h">📈 30 日信号评分趋势 <span style="margin-left:auto;font-size:11px;color:var(--muted)" id="hist-stock">300750 宁德时代</span></div>
                      <div class="card-b" style="flex:1;display:flex;flex-direction:column">
                        <div id="history-chart"></div>
                        <div style="margin-top:8px;font-size:10px;color:var(--muted);text-align:center">
                          拖拽底部滑块缩放时间区间 · 虚线为评级阈值线
                        </div>
                      </div>
                    </div>
                  </div>
            
                  <!-- Right: Hit Rate -->
                  <div class="sr">
                    <div class="card">
                      <div class="card-h">🎯 同级别历史命中率</div>
                      <div class="card-b">
                        <div class="hit">
                          <div class="hc">
                            <div class="hl" style="color:var(--up)">🟢 STRONG_BUY</div>
                            <div class="hm">出现 <b id="sb-count">15</b> 次<br>方向正确率 <b class="up">80%</b><br>平均收益 <b class="up">+5.2%</b></div>
                          </div>
                          <div class="hc">
                            <div class="hl" style="color:var(--warn)">🟡 BUY</div>
                            <div class="hm">出现 <b id="b-count">8</b> 次<br>方向正确率 <b class="warn">68%</b><br>平均收益 <b class="warn">+2.1%</b></div>
                          </div>
                        </div>
                        <div class="hs" id="hs-line">
                          近30天 STRONG_BUY 信号出现 <b style="color:var(--fg)">3</b> 次, 其中 <b style="color:var(--up)">2</b> 次兑现
                        </div>
                      </div>
                    </div>
            
                    <div class="card">
                      <div class="card-h">📊 评分统计</div>
                      <div class="card-b">
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                          <span style="font-size:11px;color:var(--fg-2)">近30日均分</span>
                          <span class="mono" style="font-size:14px;font-weight:650;color:var(--accent)" id="stat-avg">71.2</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                          <span style="font-size:11px;color:var(--fg-2)">最高分</span>
                          <span class="mono" style="font-size:14px;font-weight:650;color:var(--up)" id="stat-max">88</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                          <span style="font-size:11px;color:var(--fg-2)">最低分</span>
                          <span class="mono" style="font-size:14px;font-weight:650;color:var(--down)" id="stat-min">48</span>
                        </div>
                        <div style="display:flex;justify-content:space-between">
                          <span style="font-size:11px;color:var(--fg-2)">标准差</span>
                          <span class="mono" style="font-size:14px;font-weight:650" id="stat-std">11.3</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
            
                <!-- Quick Action Bar -->
                <div class="qa">
                  <button class="primary" onclick="action('pool')">📥 加入候选池</button>
                  <button class="primary" onclick="action('trade')">📈 跳转交易中心下单</button>
                  <button onclick="action('diagnosis')">🏥 查看诊断</button>
                  <button onclick="action('alert')">🔔 设价格预警</button>
                </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/shell.js"></script>
<script>
// ── Mock：各标的 30 日评分序列参数（与 6.0/6.1 口径一致） ──
var STOCKS = {
  '300750': { name:'宁德时代', seed:11, base:66, trend:0.7 },
  '688981': { name:'中芯国际', seed:23, base:62, trend:0.4 },
  '002371': { name:'北方华创', seed:37, base:60, trend:0.3 },
  '600519': { name:'贵州茅台', seed:41, base:64, trend:0.2 },
  '000001': { name:'平安银行', seed:53, base:50, trend:0.1 },
  '002594': { name:'比亚迪',   seed:67, base:56, trend:-0.1 },
}
var currentCode = '300750'

var dates = []
for (var i = 0; i < 30; i++) {
  var d = new Date(2026, 4, 29 + i)
  dates.push((d.getMonth()+1) + '/' + d.getDate())
}

function makeRnd(seed){ var s = seed; return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646 } }

function genScores(code){
  var st = STOCKS[code]
  var rnd = makeRnd(st.seed)
  var scores = []
  for (var i = 0; i < 30; i++) {
    var v = st.base + st.trend * i + (rnd() * 22 - 11)
    scores.push(Math.max(28, Math.min(95, Math.round(v))))
  }
  return scores
}

var scores = genScores(currentCode)

function ratingsOf(list){
  var ratings = [], colors = []
  for (var j = 0; j < list.length; j++) {
    var s = list[j]
    if (s >= 80) { ratings.push('SB'); colors.push('#ff4d4f') }
    else if (s >= 60) { ratings.push('B'); colors.push('#f5a623') }
    else if (s >= 40) { ratings.push('H'); colors.push('#3d8bff') }
    else { ratings.push('S'); colors.push('#5e6a7d') }
  }
  return { ratings: ratings, colors: colors }
}

// ── History Chart ──
var chart = echarts.init(document.getElementById('history-chart'), (window.suyingEchartsTheme?suyingEchartsTheme():'dark'))

function renderChart(){
  var rc = ratingsOf(scores)
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{
      trigger:'axis',
      backgroundColor:'#1b2330',
      borderColor:'#2a3444',
      textStyle:{ fontSize:11, color:'#e8edf4' },
      formatter:function(params){
        var p = params[0]
        var idx = p.dataIndex
        var r = rc.ratings[idx]
        var rl = r === 'SB' ? 'STRONG_BUY' : r === 'B' ? 'BUY' : r === 'H' ? 'HOLD' : 'SELL'
        return dates[idx] + '<br/>评分: <b>' + p.value + '</b> · 评级: <b>' + rl + '</b>'
      }
    },
    grid:{ left:'4%', right:'4%', top:'8%', bottom:'18%' },
    xAxis:{
      type:'category', data:dates,
      axisLabel:{ fontSize:9, color:'#5e6a7d', rotate:30 },
      axisLine:{ lineStyle:{ color:'#1f2733' } },
      axisTick:{ show:false }
    },
    yAxis:{
      type:'value', min:0, max:100,
      splitLine:{ lineStyle:{ color:'#1f2733' } },
      axisLabel:{ fontSize:10, color:'#5e6a7d' }
    },
    series:[{
      type:'line', data:scores, name:'综合评分', smooth:true,
      lineStyle:{ color:'#3d8bff', width:2 },
      areaStyle:{
        color:{
          type:'linear', x:0, y:0, x2:0, y2:1,
          colorStops:[
            { offset:0, color:'rgba(61,139,255,0.18)' },
            { offset:1, color:'rgba(61,139,255,0)' }
          ]
        }
      },
      symbol:'circle', symbolSize:4,
      itemStyle:{ color:function(p){ return rc.colors[p.dataIndex] } },
      markLine:{
        silent:true, symbol:'none',
        data:[
          { yAxis:80, lineStyle:{ color:'rgba(255,77,79,0.3)', type:'dashed' }, label:{ formatter:'STRONG_BUY 80', fontSize:9, color:'#ff4d4f' } },
          { yAxis:60, lineStyle:{ color:'rgba(245,166,35,0.3)', type:'dashed' }, label:{ formatter:'BUY 60', fontSize:9, color:'#f5a623' } },
          { yAxis:40, lineStyle:{ color:'rgba(94,106,125,0.3)', type:'dashed' }, label:{ formatter:'SELL 40', fontSize:9, color:'#5e6a7d' } }
        ]
      }
    }],
    dataZoom:[
      { type:'inside' },
      { type:'slider', height:18, bottom:2, borderColor:'#1f2733', backgroundColor:'#11161f', fillerColor:'rgba(61,139,255,0.1)', textStyle:{ fontSize:9, color:'#5e6a7d' } }
    ]
  })
}

/* 右栏统计随标的重算 */
function renderStats(){
  var n = scores.length
  var sum = scores.reduce(function(a,b){ return a+b }, 0)
  var avg = sum / n
  var max = Math.max.apply(null, scores)
  var min = Math.min.apply(null, scores)
  var variance = scores.reduce(function(a,b){ return a + (b-avg)*(b-avg) }, 0) / n
  var rc = ratingsOf(scores)
  var sbCount = rc.ratings.filter(function(r){ return r==='SB' }).length
  var bCount = rc.ratings.filter(function(r){ return r==='B' }).length
  document.getElementById('stat-avg').textContent = avg.toFixed(1)
  document.getElementById('stat-max').textContent = max
  document.getElementById('stat-min').textContent = min
  document.getElementById('stat-std').textContent = Math.sqrt(variance).toFixed(1)
  document.getElementById('sb-count').textContent = sbCount
  document.getElementById('b-count').textContent = bCount
  var recentSb = rc.ratings.slice(-10).filter(function(r){ return r==='SB' }).length
  document.getElementById('hs-line').innerHTML =
    '近30天 STRONG_BUY 信号出现 <b style="color:var(--fg)">' + sbCount + '</b> 次, 其中 <b style="color:var(--up)">' + Math.max(0, sbCount-1) + '</b> 次兑现'
}

function switchStock(name, code, el) {
  document.querySelectorAll('.qsc').forEach(function(c){ c.classList.remove('active') })
  if (el) el.classList.add('active')
  currentCode = code
  scores = genScores(code)
  document.getElementById('hist-stock').textContent = code + ' ' + name
  renderChart()
  renderStats()
}

// ── Action bar ──
function action(type) {
  var s = STOCKS[currentCode] || STOCKS['300750']
  if (type === 'pool') {
    try {
      // 统一 schema: [{code, name, src, date, ...}]，兼容历史字符串元素
      var pool = JSON.parse(localStorage.getItem('suying_mock_candidate_pool') || '[]')
      pool = pool.map(function(e){ return typeof e === 'string' ? { code: e, name: '', src: '', date: '' } : e }).filter(function(e){ return e && e.code })
      if (pool.some(function(p){ return p.code === currentCode })) {
        if (window.suyingToast) suyingToast(s.name + ' 已在候选池中', 'info')
        return
      }
      pool.push({ code: currentCode, name: s.name, src: 'signal', date: new Date().toISOString().slice(0,10), ts: Date.now() })
      localStorage.setItem('suying_mock_candidate_pool', JSON.stringify(pool))
    } catch (err) {}
    if (window.suyingToast) suyingToast(s.name + ' ' + currentCode + ' 已加入候选池', 'ok')
  } else if (type === 'trade') {
    try { localStorage.setItem('suying_mock_order_prefill', JSON.stringify({ code: currentCode, name: s.name })) } catch (err) {}
    location.href = '7.1 order-panel-preview.html'
  } else if (type === 'diagnosis') {
    try { localStorage.setItem('suying_mock_diagnosis_code', JSON.stringify({ code: currentCode, name: s.name })) } catch (err) {}
    location.href = '12.0 diagnosis-preview.html'
  } else if (type === 'alert') {
    if (!window.suyingConfirm) return
    suyingConfirm('为 ' + s.name + ' (' + currentCode + ') 设置价格预警：信号评分突破 80 / 跌破 60 时提醒？', function(){
      try {
        var alerts = JSON.parse(localStorage.getItem('suying_mock_alerts') || '[]')
        alerts.push({ code: currentCode, name: s.name, type: '评分预警', ts: Date.now() })
        localStorage.setItem('suying_mock_alerts', JSON.stringify(alerts))
      } catch (err) {}
      if (window.suyingToast) suyingToast(s.name + ' 价格预警已设置', 'ok')
    }, { title: '设价格预警', okText: '确认设置' })
  }
}

// ── 搜索框：回车按代码/名称匹配并切换 ──
(function initSearch(){
  var input = document.getElementById('qsb-search')
  if (!input) return
  input.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return
    var q = input.value.trim()
    if (!q) return
    var hit = Object.keys(STOCKS).find(function(code){
      return code === q || STOCKS[code].name === q || STOCKS[code].name.indexOf(q) >= 0 || code.indexOf(q) === 0
    })
    if (hit) {
      switchStock(STOCKS[hit].name, hit, null)
      input.value = ''
      input.blur()
      if (window.suyingToast) suyingToast('已切换到 ' + STOCKS[hit].name + ' ' + hit, 'ok')
    } else if (window.suyingToast) {
      suyingToast('未找到标的「' + q + '」，请检查代码/名称', 'warn')
    }
  })
})()

renderChart()
renderStats()
window.addEventListener('resize',function(){ chart.resize() })
</script>
<script src="assets/preview-interactions.js"></script>
</body>
