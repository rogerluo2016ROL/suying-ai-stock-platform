<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>速赢AI · 交易信号 — 信号历史</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style class="legacy-page-style">
:root{
  --bg:#0b0e14; --surface:#11161f; --surface-2:#161c28; --elevated:#1b2330;
  --border:#1f2733; --border-2:#2a3444;
  --fg:#e8edf4; --fg-2:#9aa7b8; --muted:#5e6a7d;
  --accent:#3d8bff; --accent-dim:rgba(61,139,255,0.14);
  --up:#ff4d4f; --up-bg:rgba(255,77,79,0.12);
  --down:#2ec27e; --down-bg:rgba(46,194,126,0.12);
  --warn:#f5a623; --warn-bg:rgba(245,166,35,0.12);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sidebar-w:232px; --header-h:52px; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .neu{color:var(--accent)} .warn{color:var(--warn)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column}
.brand{height:var(--header-h);display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7db2ff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.brand .name{font-weight:680;font-size:15px}
.brand .name b{color:var(--accent)}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-group{font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding:14px 12px 7px;font-weight:650}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;margin:1px 0;border-radius:6px;color:var(--fg-2);cursor:pointer;font-size:13.5px;font-weight:500;position:relative;transition:.12s}
.nav-item:hover{background:var(--elevated);color:var(--fg)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;height:100vh}
.header{height:var(--header-h);flex-shrink:0;position:sticky;top:0;z-index:30;background:rgba(17,22,31,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px}
.content{flex:1;display:flex;flex-direction:column;padding:16px 20px 0;overflow:hidden}

/* QuickSelectBar */
.qsb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);flex-shrink:0;flex-wrap:wrap}
.qsb .qsb-label{font-size:10.5px;color:var(--muted);white-space:nowrap}
.qsb .qsb-chips{display:flex;gap:6px;flex-wrap:wrap}
.qsc{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;font-size:11px;transition:.12s}
.qsc:hover{background:var(--elevated);border-color:var(--border-2)}
.qsc.active{background:var(--accent-dim);border-color:var(--accent)}
.qsc .n{font-weight:600;color:var(--fg)}
.qsc .c{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
.qsb input{padding:3px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-family:var(--font-mono);font-size:11px;outline:none;width:130px}
.qsb input:focus{border-color:var(--accent)}
.qsb input::placeholder{color:var(--muted);font-family:var(--font-sans)}

/* Pill SubTabBar */
.stb{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:8px;width:fit-content;flex-shrink:0;margin:10px 0}
.stb a{padding:5px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--fg-2);cursor:pointer;border:none;background:transparent;transition:.12s;font-family:var(--font-sans);text-decoration:none;display:inline-block}
.stb a:hover{color:var(--fg)}
.stb a.on{background:var(--accent-dim);color:var(--accent);font-weight:650}

/* Main Row */
.sm{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
.sl{flex:60;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sr{flex:40;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sl::-webkit-scrollbar,.sr::-webkit-scrollbar{width:4px}
.sl::-webkit-scrollbar-thumb,.sr::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:650}
.card-b{padding:14px}

/* History Chart */
#history-chart{width:100%;height:360px}

/* Hit Rate */
.hit{display:flex;gap:14px}
.hc{flex:1;background:var(--surface-2);border-radius:var(--radius);padding:14px;text-align:center}
.hc .hl{font-size:13px;font-weight:650;margin-bottom:8px}
.hc .hm{font-size:11px;color:var(--fg-2);line-height:1.7}
.hc .hm b{font-family:var(--font-mono);font-weight:650}
.hs{margin-top:14px;padding:10px 14px;background:var(--surface-2);border-radius:6px;font-size:11px;color:var(--fg-2);text-align:center}

/* Quick Action Bar */
.qa{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--border);margin-top:auto;flex-shrink:0}
.qa button{flex:1;text-align:center;font-size:11.5px;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--elevated);color:var(--fg-2);cursor:pointer;transition:.12s;font-family:var(--font-sans)}
.qa button:hover{background:var(--surface);color:var(--fg)}
.qa button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.qa button.primary:hover{background:#2d7ae0}
</style>
<link rel="stylesheet" href="assets/app.css" />
<link rel="stylesheet" href="assets/preview-adapter.css" />
</head>
<body class="legacy-preview" data-page="signals" data-title="交易信号 — 信号历史">
<div class="app">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="header-mount"></div>
    <main class="content">
<!-- QuickSelectBar -->
                <div class="qsb">

                    <span class="qsc active"><span class="n">宁德时代</span><span class="c">300750</span></span>

                  </div>
                  <span class="qsb-label" style="margin-left:8px">最近:</span>
                  <div class="qsb-chips">
                    <span class="qsc" onclick="switchStock('比亚迪','002594')"><span class="n">比亚迪</span><span class="c">002594</span></span>
                  </div>
                  <input type="text" placeholder="搜索代码/名称..." style="margin-left:auto">
                </div>
<!-- History Content -->
                <div class="sm" style="flex:1">
                  <!-- Left: Chart -->
                  <div class="sl">
                    <div class="card" style="flex:1;display:flex;flex-direction:column">
                      <div class="card-h">📈 30 日信号评分趋势 <span style="margin-left:auto;font-size:11px;color:var(--muted)">300750 宁德时代</span></div>
                      <div class="card-b" style="flex:1;display:flex;flex-direction:column">

                  <!-- Right: Hit Rate -->
                  <div class="sr">

                    <div class="card">

                      <div class="card-b">

                <!-- Quick Action Bar -->
                <div class="qa">

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/shell.js"></script>
<script>
function switchStock(name, code) {
  document.querySelectorAll('.qsc').forEach(function(el){ el.classList.remove('active') })
  if (event && event.target.closest('.qsc')) event.target.closest('.qsc').classList.add('active')
}

function action(type) {
  var map = { pool:'已加入候选池', trade:'跳转交易中心...', diagnosis:'跳转个股诊断...', alert:'已设置价格预警' }
  showToast(map[type] || type)
}

function showToast(msg) {
  var t = document.getElementById('toast')
  if (!t) {
    t = document.createElement('div')
    t.id = 'toast'
    t.style.cssText = 'position:fixed;top:20px;right:20px;z-index:100;padding:10px 20px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none'
    document.body.appendChild(t)
  }
  t.textContent = msg
  t.style.opacity = '1'
  t.style.transform = 'translateY(0)'
  setTimeout(function(){ t.style.opacity = '0'; t.style.transform = 'translateY(-10px)' }, 1500)
}

// ── History Chart ──
(function initHistory(){
  var dom = document.getElementById('history-chart')
  var chart = echarts.init(dom, 'dark')

  var dates = []
  for (var i = 0; i < 30; i++) {
    var d = new Date(2026, 4, 29 + i)
    dates.push((d.getMonth()+1) + '/' + d.getDate())
  }

  var scores = [52,48,55,58,62,60,65,70,68,72,75,71,68,73,78,80,82,79,76,81,85,83,80,78,82,86,88,85,83,85]
  var ratings = []
  var colors = []
  for (var j = 0; j < scores.length; j++) {
    var s = scores[j]
    if (s >= 80) { ratings.push('SB'); colors.push('#ff4d4f') }
    else if (s >= 60) { ratings.push('B'); colors.push('#f5a623') }
    else if (s >= 40) { ratings.push('H'); colors.push('#3d8bff') }
    else { ratings.push('S'); colors.push('#5e6a7d') }
  }

  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{
      trigger:'axis',
      backgroundColor:'#1b2330',
      borderColor:'#2a3444',
      textStyle:{ fontSize:11, color:'#e8edf4' },
      formatter:function(params){
        var p = params[0]
        var idx = p.dataIndex
        var r = ratings[idx]
        var rl = r === 'SB' ? 'STRONG_BUY' : r === 'B' ? 'BUY' : r === 'H' ? 'HOLD' : 'SELL'
        return dates[idx] + '<br/>评分: <b>' + p.value + '</b> · 评级: <b>' + rl + '</b>'
      }
    },
    grid:{ left:'4%', right:'4%', top:'8%', bottom:'18%' },
    xAxis:{
      type:'category', data:dates,
      axisLabel:{ fontSize:9, color:'#5e6a7d', rotate:30 },
      axisLine:{ lineStyle:{ color:'#1f2733' } },
      axisTick:{ show:false }
    },
    yAxis:{
      type:'value', min:0, max:100,
      splitLine:{ lineStyle:{ color:'#1f2733' } },
      axisLabel:{ fontSize:10, color:'#5e6a7d' }
    },
    series:[{
      type:'line', data:scores, name:'综合评分', smooth:true,
      lineStyle:{ color:'#3d8bff', width:2 },
      areaStyle:{
        color:{
          type:'linear', x:0, y:0, x2:0, y2:1,
          colorStops:[
            { offset:0, color:'rgba(61,139,255,0.18)' },
            { offset:1, color:'rgba(61,139,255,0)' }
          ]
        }
      },
      symbol:'circle', symbolSize:4,
      itemStyle:{ color:function(p){ return colors[p.dataIndex] } },
      markLine:{
        silent:true, symbol:'none',
        data:[
          { yAxis:80, lineStyle:{ color:'rgba(255,77,79,0.3)', type:'dashed' }, label:{ formatter:'STRONG_BUY 80', fontSize:9, color:'#ff4d4f' } },
          { yAxis:60, lineStyle:{ color:'rgba(245,166,35,0.3)', type:'dashed' }, label:{ formatter:'BUY 60', fontSize:9, color:'#f5a623' } },
          { yAxis:40, lineStyle:{ color:'rgba(94,106,125,0.3)', type:'dashed' }, label:{ formatter:'SELL 40', fontSize:9, color:'#5e6a7d' } }
        ]
      }
    }],
    dataZoom:[
      { type:'inside' },
      { type:'slider', height:18, bottom:2, borderColor:'#1f2733', backgroundColor:'#11161f', fillerColor:'rgba(61,139,255,0.1)', textStyle:{ fontSize:9, color:'#5e6a7d' } }
    ]
  })

  window.addEventListener('resize',function(){ chart.resize() })
})()
</script>
