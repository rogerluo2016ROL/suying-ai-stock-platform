[project]
name = "kronos-core"
version = "0.2.0"
description = "Kronos K-line foundation model — tokenizer, transformer predictor (AAAI 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "torch>=2.0",
    "einops>=0.7",
    "huggingface-hub>=0.16",
    "safetensors>=0.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
