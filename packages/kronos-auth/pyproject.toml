[project]
name = "kronos-auth"
version = "0.1.0"
description = "Shared JWT auth + RBAC for Suying AI microservices"
requires-python = ">=3.10"
dependencies = [
    "PyJWT>=2.8",
    "fastapi>=0.100",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
