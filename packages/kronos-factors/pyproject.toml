[project]
name = "kronos-factors"
version = "0.1.0"
description = "Factor scoring, strategy engines, and backtest for A-share stock screening"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kronos_factors*"]
