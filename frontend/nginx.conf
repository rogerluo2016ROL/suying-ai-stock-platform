server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/v1/auth/ { set $upstream http://backend:9001; proxy_pass $upstream; }
  location /api/v1/admin/ { set $upstream http://backend:9001; proxy_pass $upstream; }
  location /api/v1/screener/ { set $upstream http://screener-service:8001; proxy_pass $upstream; }
  location /api/v1/dashboard/ { set $upstream http://screener-service:8001; proxy_pass $upstream; }
  location /api/v1/prediction/ { set $upstream http://prediction-service:8002; proxy_pass $upstream; }
  location /api/v1/strategy/ { set $upstream http://strategy-service:8003; proxy_pass $upstream; }
  location /api/v1/signal/ { set $upstream http://signal-service:8004; proxy_pass $upstream; }
  location /api/v1/alert/ { set $upstream http://alert-service:8005; proxy_pass $upstream; }
  location /api/v1/trade/ { set $upstream http://trade-service:8006; proxy_pass $upstream; }
  location /api/v1/backtest/ { set $upstream http://backtest-service:8007; proxy_pass $upstream; }
  location /api/v1/training/ { set $upstream http://training-service:8008; proxy_pass $upstream; }
  location /api/v1/diagnosis/ { set $upstream http://diagnosis-service:8009; proxy_pass $upstream; }
  location /api/v1/data/ { set $upstream http://data-service:8010; proxy_pass $upstream; }
  location /api/v1/system/ { set $upstream http://data-service:8010; proxy_pass $upstream; }
  location /api/v1/runtime/ { set $upstream http://api-gateway:8080; proxy_pass $upstream; }
  location /health { set $upstream http://api-gateway:8080; proxy_pass $upstream; }
  location /api/v1/workbench/ { set $upstream http://api-gateway:8080; proxy_pass $upstream; }

  location / { try_files $uri $uri/ /index.html; }
}
