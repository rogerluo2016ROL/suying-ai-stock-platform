server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/auth/ { proxy_pass http://backend:9001; }
  location /api/v1/admin/ { proxy_pass http://backend:9001; }
  location /api/v1/screener/ { proxy_pass http://screener-service:8001; }
  location /api/v1/dashboard/ { proxy_pass http://screener-service:8001; }
  location /api/v1/prediction/ { proxy_pass http://prediction-service:8002; }
  location /api/v1/strategy/ { proxy_pass http://strategy-service:8003; }
  location /api/v1/signal/ { proxy_pass http://signal-service:8004; }
  location /api/v1/alert/ { proxy_pass http://alert-service:8005; }
  location /api/v1/trade/ { proxy_pass http://trade-service:8006; }
  location /api/v1/backtest/ { proxy_pass http://backtest-service:8007; }
  location /api/v1/training/ { proxy_pass http://training-service:8008; }
  location /api/v1/diagnosis/ { proxy_pass http://diagnosis-service:8009; }
  location /health { proxy_pass http://api-gateway:8080; }
  location /api/v1/workbench/ { proxy_pass http://api-gateway:8080; }

  location / { try_files $uri $uri/ /index.html; }
}
