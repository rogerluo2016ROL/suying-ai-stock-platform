[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-dashboard-server"
version = "0.1.0"
description = "Team Dashboard server – FastAPI + SSE backend for agf-team-start sessions"
requires-python = ">=3.11"
dependencies = [
    # Pinned to align with ADR-000 tech-stack baseline (FastAPI 0.136.x line).
    # Upper bounds prevent surprise breakage when next minor ships with breaking changes.
    # uvicorn: task suggested <0.40 but 0.46 is current; widened to <0.50 (see commit body).
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn[standard]>=0.30,<0.50",
    "watchfiles>=0.22",
    "pydantic>=2.7,<3",
    # sse-starlette removed: main.py uses Starlette's built-in StreamingResponse for SSE,
    # sse-starlette was never imported — dead dependency.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
# Flat layout: all .py files live directly in server/ (no sub-package directory).
# Hatchling's default heuristic looks for a directory named `team_dashboard_server`
# which doesn't exist; explicitly telling it "." makes it include server/ as the
# editable root so `pip install -e .` creates a .pth pointing here, and
# `import main`, `import watcher`, etc. all resolve correctly.
packages = ["."]

[tool.pytest.ini_options]
# Run pytest from tools/team-dashboard/server/ directory
# conftest.py in that directory adds server/ to sys.path for direct imports
asyncio_mode = "auto"
testpaths = ["tests"]
