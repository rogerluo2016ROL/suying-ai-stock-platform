[project]
name = "backtest-service"
version = "0.1.0"
description = "Backtest and calibration microservice — IC analysis, strategy validation"
requires-python = ">=3.10"
dependencies = [
    "kronos-contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "kronos-factors",
    "kronos-auth",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
