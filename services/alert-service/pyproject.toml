[project]
name = "alert-service"
version = "0.1.0"
description = "FastAPI alert service — multi-channel trade alert & notification"
requires-python = ">=3.10"
dependencies = [
    "kronos-contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "lark-oapi>=1.7.0",
    "kronos-auth",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
