[project]
name = "strategy-service"
version = "0.1.0"
description = "FastAPI strategy service — LLM-powered trading plan generation & auto-trading"
requires-python = ">=3.10"
dependencies = [
    "kronos-contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg",
    "sqlalchemy>=2.0",
    "kronos-auth",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
