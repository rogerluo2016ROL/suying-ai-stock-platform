[project]
name = "screener-service"
version = "0.1.0"
description = "FastAPI stock screening microservice — 6 strategies, unified API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "kronos-factors",
    "openai>=1.0",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
# Explicit package declaration — services/screener-service/ has both app/ (real pkg)
# and outputs/ (backtest artifacts), flat-layout auto-discovery hits 2 top-level pkgs
# → setuptools refuses. Pin to app/ only (UAT build 阻断 2 根因修复).

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
