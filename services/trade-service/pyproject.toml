[project]
name = "trade-service"
version = "0.1.0"
description = "FastAPI trade service — paper & live trading with broker integration"
requires-python = ">=3.10"
dependencies = [
    "kronos-contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg",
    "sqlalchemy>=2.0",
    "kronos-factors",
    "kronos-core",
    "kronos-data",
    "kronos-auth",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
# P0-3: enables `cd services/trade-service && pytest`. asyncio_mode=auto so
# `async def test_*` runs on the event loop without per-test markers.
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
