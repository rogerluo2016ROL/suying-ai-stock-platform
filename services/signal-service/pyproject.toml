[project]
name = "signal-service"
version = "0.1.0"
description = "FastAPI signal service — real-time trading signal generation (50-dim)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "kronos-factors",
    "kronos-core",
    "kronos-data",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
