# 速赢AI证券投资管理平台 — Docker Compose (开发环境)
#
# 启动所有服务:
#   cd docker && docker compose up -d
#
# 服务端口:
#   8080 — api-gateway          (统一网关)
#   8001 — screener-service     (选股+排序, 12模型)
#   8002 — prediction-service   (Kronos K线预测)
#   8003 — strategy-service     (LLM方案生成+自动交易)
#   8004 — signal-service       (交易信号, 50维)
#   8005 — alert-service        (预警提醒)
#   8006 — trade-service        (模拟+实盘交易)
#   8007 — backtest-service     (回测+IC校准)
#   8009 — diagnosis-service    (五维个股诊断)
#   9001 — backend              (JWT认证+用户管理)

version: "3.8"

services:
  # ── 基础设施 ──
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos
      POSTGRES_DB: kronos
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../services/sql/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 微服务 ──

  # API Gateway (统一入口)
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Backend (认证+用户管理)
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kronos:kronos@postgres:5432/kronos
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in env (>=32 chars in prod)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@suying.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in env (no hardcoded default)}
      - DATABASE_SYNC_URL=postgresql+psycopg2://kronos:kronos@postgres:5432/kronos
      - KRONOS_ENV=production
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Screener (选股)
  screener-service:
    build:
      context: ..
      dockerfile: services/screener-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DB_PATH=/data/kronos.db
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../Kronos/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Prediction (Kronos K线预测)
  prediction-service:
    build:
      context: ..
      dockerfile: services/prediction-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DEVICE=cpu
    volumes:
      - ../Kronos/outputs/models:/app/Kronos/outputs/models:ro
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped

  # Strategy (方案管理+自动交易引擎)
  strategy-service:
    build:
      context: ..
      dockerfile: services/strategy-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TRADE_SERVICE_URL=http://trade-service:8006
      - SIGNAL_SERVICE_URL=http://signal-service:8004
      - KRONOS_ENV=production
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Signal (交易信号)
  signal-service:
    build:
      context: ..
      dockerfile: services/signal-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DB_PATH=/data/kronos.db
    volumes:
      - ../Kronos/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Alert (预警提醒)
  alert-service:
    build:
      context: ..
      dockerfile: services/alert-service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Trade (模拟/实盘交易)
  trade-service:
    build:
      context: ..
      dockerfile: services/trade-service/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - TRADE_MODE=paper
      - KRONOS_ENV=production
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Backtest (回测+IC校准)
  backtest-service:
    build:
      context: ..
      dockerfile: services/backtest-service/Dockerfile
    ports:
      - "8007:8007"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DB_PATH=/data/kronos.db
    volumes:
      - ../Kronos/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Diagnosis (五维个股诊断)
  diagnosis-service:
    build:
      context: ..
      dockerfile: services/diagnosis-service/Dockerfile
    ports:
      - "8009:8009"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model_cache:
