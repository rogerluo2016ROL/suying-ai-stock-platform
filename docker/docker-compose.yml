# 速赢AI证券投资管理平台 — Docker Compose (开发环境)
#
# 启动所有服务:
#   cd docker && docker compose up -d                      # dev (default ports)
#   cd docker && docker compose --env-file .env.uat up -d  # UAT (offset ports, 隔离)
#
# 端口 env 驱动（deployment.md §6.2 隔离契约）：
#   dev 不设 *_PORT → 用 default（6432/8080/9001/8001-8009/7379）
#   UAT 在 .env.uat 设偏移端口（如 +900: POSTGRES_PORT=7332/BACKEND_PORT=9901/...）避 dev 冲突
#   容器内端口不变（服务间用 service name + 内部端口通信）
#
# 安全绑定：postgres/redis 与内部微服务 (8001-8010) 仅绑 127.0.0.1（本机调试可达，LAN 不可达）；
#   对外入口仅 api-gateway:8080 / backend:9001 / frontend:3000。
#
# 服务端口 (default):
#   8080 — api-gateway          (统一网关)
#   8001 — screener-service     (选股+排序, 12模型)
#   8002 — prediction-service   (Kronos K线预测)
#   8003 — strategy-service     (LLM方案生成+自动交易)
#   8004 — signal-service       (交易信号, 50维)
#   8005 — alert-service        (预警提醒)
#   8006 — trade-service        (模拟+实盘交易)
#   8007 — backtest-service     (回测+IC校准)
#   8009 — diagnosis-service    (五维个股诊断)
#   8010 — data-service         (后台数据采集+定时调度, 常驻)
#   9001 — backend              (JWT认证+用户管理)

version: "3.8"

services:
  # ── 基础设施 ──
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos
      POSTGRES_DB: kronos
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../services/sql/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../services/sql/materialized_views.sql:/docker-entrypoint-initdb.d/02_materialized_views.sql:ro
      - ../services/sql/self_learning_init.sql:/docker-entrypoint-initdb.d/03_self_learning_init.sql:ro
      - ../services/sql/tushare_parameter_catalog.sql:/docker-entrypoint-initdb.d/04_tushare_parameter_catalog.sql:ro
      - ../services/sql/data_governance_completion.sql:/docker-entrypoint-initdb.d/05_data_governance_completion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 微服务 ──

  # API Gateway (统一入口)
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      # DEF-3 fix: 容器内用 compose 服务名寻址 (非 localhost); 逐服务 host 可被 GATEWAY_<NAME>_HOST 覆盖
      - GATEWAY_NETWORK_MODE=compose
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_started
      backend:
        condition: service_started
      screener-service:
        condition: service_started
    restart: unless-stopped

  # Backend (认证+用户管理)
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-9001}:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kronos:kronos@postgres:5432/kronos
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in env (>=32 chars in prod)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@suying.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in env (no hardcoded default)}
      - DATABASE_SYNC_URL=postgresql+psycopg2://kronos:kronos@postgres:5432/kronos
      - KRONOS_ENV=production
      # 生产默认 Secure=true（https）；本地 http 开发在 .env 显式设 AUTH_COOKIE_SECURE=false
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Screener (选股)
  screener-service:
    build:
      context: ..
      dockerfile: services/screener-service/Dockerfile
    ports:
      - "127.0.0.1:${SCREENER_PORT:-8001}:8001"
    env_file:
      - .env.lark-bot
    environment:
      - KRONOS_PG_URL=${KRONOS_PG_URL:-postgresql://kronos:kronos@postgres:5432/kronos}
      - TUSHARE_TOKEN_FILE=/run/secrets/tushare_token
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
      # 调 data/alert 等已认证服务需带 X-Service-Auth；自身接口 JWT 验签用 JWT_SECRET_KEY
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Data (后台数据采集 + 定时调度, 常驻 — 竞价 9:25 / rt_min / 盘后全量 / 凌晨回补)
  data-service:
    build:
      context: ..
      dockerfile: services/data-service/Dockerfile
    ports:
      - "127.0.0.1:${DATA_SERVICE_PORT:-8010}:8010"
    env_file:
      - .env.lark-bot
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DB_PATH=/data/kronos.db     # 只读挂载; PG-only 下仅 _get_etl_db fallback 占位
      - TUSHARE_TOKEN_FILE=/run/secrets/tushare_token
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai                   # 关键: cron "25 9" 按容器本地时区 (否则 UTC 偏移)
      - DATA_SQLITE_FALLBACK=false          # 显式 PG-only (清债后 :ro 挂载安全)
      - TUSHARE_RATE_PER_MIN=${TUSHARE_RATE_PER_MIN:-450}      # VIP 可调到 2000
      - TUSHARE_FINANCIAL_WORKERS=${TUSHARE_FINANCIAL_WORKERS:-8}  # 财报并行拉取线程数
      - LARK_DOC_CREATE_AS=bot              # 容器不使用个人飞书登录态
      - LARK_CLI_INIT_BOT=true              # 运行时从标准输入初始化 bot，不把密钥写入镜像
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    volumes:
      - ../Kronos/data:/data:ro            # 只读 (清债后无 SQLite 写)
      - ./secrets:/run/secrets:ro
      - ../outputs:/app/outputs             # 保存调度幂等状态、报告和送达证据
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Prediction (Kronos K线预测)
  prediction-service:
    build:
      context: ..
      dockerfile: services/prediction-service/Dockerfile
    ports:
      - "127.0.0.1:${PREDICTION_PORT:-8002}:8002"
    environment:
      - KRONOS_ENV=production
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_DEVICE=cpu
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    volumes:
      - ../Kronos/outputs/models:/app/Kronos/outputs/models:ro
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped

  # Strategy (方案管理+自动交易引擎)
  strategy-service:
    build:
      context: ..
      dockerfile: services/strategy-service/Dockerfile
    ports:
      - "127.0.0.1:${STRATEGY_PORT:-8003}:8003"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TRADE_SERVICE_URL=http://trade-service:8006
      - SIGNAL_SERVICE_URL=http://signal-service:8004
      - KRONOS_ENV=production
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Signal (交易信号)
  signal-service:
    build:
      context: ..
      dockerfile: services/signal-service/Dockerfile
    ports:
      - "127.0.0.1:${SIGNAL_PORT:-8004}:8004"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - DATA_SERVICE_URL=http://data-service:8010/api/v1/data
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
      data-service:
        condition: service_started
    restart: unless-stopped

  # Alert (预警提醒)
  alert-service:
    build:
      context: ..
      dockerfile: services/alert-service/Dockerfile
    ports:
      - "127.0.0.1:${ALERT_PORT:-8005}:8005"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Trade (模拟/实盘交易)
  trade-service:
    build:
      context: ..
      dockerfile: services/trade-service/Dockerfile
    ports:
      - "127.0.0.1:${TRADE_PORT:-8006}:8006"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - TRADE_MODE=paper
      - KRONOS_ENV=production
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Backtest (回测+IC校准)
  backtest-service:
    build:
      context: ..
      dockerfile: services/backtest-service/Dockerfile
    ports:
      - "127.0.0.1:${BACKTEST_PORT:-8007}:8007"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Training (模型训练 + 模型注册)
  training-service:
    build:
      context: ..
      dockerfile: services/training-service/Dockerfile
    ports:
      - "127.0.0.1:${TRAINING_PORT:-8008}:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kronos:kronos@postgres:5432/kronos
      - DATABASE_SYNC_URL=postgresql+psycopg2://kronos:kronos@postgres:5432/kronos
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_MODE=${MLFLOW_MODE:-mock}
      - KRONOS_ENV=production
      - KRONOS_SERVICE_SECRET=${KRONOS_SERVICE_SECRET:?KRONOS_SERVICE_SECRET must be set (service-to-service auth)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Diagnosis (五维个股诊断)
  diagnosis-service:
    build:
      context: ..
      dockerfile: services/diagnosis-service/Dockerfile
    ports:
      - "127.0.0.1:${DIAGNOSIS_PORT:-8009}:8009"
    environment:
      - KRONOS_PG_URL=postgresql://kronos:kronos@postgres:5432/kronos
      - DATABASE_URL=postgresql+asyncpg://kronos:kronos@postgres:5432/kronos
      # DEF-4 fix: 跨服务 JWT 验签须与 backend 同 secret (原缺 env → fallback default → 验签失败)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (kronos-auth prod-gate)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model_cache:
