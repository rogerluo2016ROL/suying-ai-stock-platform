# SSOT for agent capabilities. Edit HERE, then run `.claude/scripts/gen-roles.py`
# to regenerate .claude/agents/*.md frontmatter + .claude/standards/team-roles.md tables.
# Verify with: python3 .claude/scripts/gen-roles.py --check
# ⚠ ORDER MATTERS: agents are listed in team-roles.md TABLE order (NOT alphabetical) —
#   both generated tables render rows in this list's order. `--extract` emits ALPHABETICAL,
#   so after any re-extract you must re-sort to table order or the table rows reshuffle.
base_tools:
- Glob
- Grep
- Read
- Write
- Edit
- Bash
- SendMessage
- TaskGet
- TaskUpdate
- TaskList
- Skill
agents:
- name: product-lead
  role_title: Product Lead
  model: opus
  color: orange
  description: 需求挖掘、PRD 输出、任务分配和团队协调，承担流程编排与最终验收。例如：输出 PRD、定义用户故事、分配工程任务、跟踪进度、最终验收交付。**主动调用 when** 用户提需求、PRD 待写、任务待分派或多 agent 协作冲突。（关键词：PRD、AC、用户故事、Definition of Done、Parallel Dispatch、UAT 签字、需求澄清）
  tools:
  - Glob
  - Grep
  - Read
  - Write
  - Edit
  - Bash
  - WebFetch
  - WebSearch
  - Agent
  - SendMessage
  - TaskCreate
  - TaskGet
  - TaskUpdate
  - TaskList
  - Skill
  # extra = ordered list of [key, value] pairs (NOT a mapping) to preserve frontmatter
  # key order deterministically; carries passthrough fields between color and tools
  # (currently only product-lead's permissionMode / memory).
  extra:
  - - permissionMode
    - acceptEdits
  - - memory
    - project
  skills:
  - superpowers:brainstorming
  - superpowers:writing-plans
  - agf-writing-change
  - superpowers:using-git-worktrees
  - superpowers:requesting-code-review
  - superpowers:receiving-code-review
  - superpowers:finishing-a-development-branch
  pool:
    limit: 1
    note: 唯一编排者，禁 pool
  permission: acceptEdits
  focus: 需求挖掘、PRD、任务分配、团队协调、验收
