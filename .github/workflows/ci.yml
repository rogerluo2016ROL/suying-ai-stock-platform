name: 速赢AI CI

on:
  push:
    branches: [main, "feature/**", "速赢AI**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Python: lint + test ──
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [kronos-factors, kronos-auth]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kronos
          POSTGRES_PASSWORD: kronos
          POSTGRES_DB: kronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install ./packages/${{ matrix.package }}

      - name: Run tests
        run: |
          cd packages/${{ matrix.package }}
          python -m pytest tests/ -v --tb=short
        env:
          KRONOS_PG_URL: postgresql://kronos:kronos@localhost:5432/kronos

  # ── Frontend: typecheck + test ──
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc -b --noEmit

      - name: Run tests
        run: cd frontend && npx vitest run --exclude='tests/sit/**'

  # ── Docker: build check ──
  service-tests:
    name: Core service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run services in isolated processes
        run: python3 tools/run_service_tests.py --core -q

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests, service-tests]
    strategy:
      matrix:
        service:
          - screener-service
          - prediction-service
          - strategy-service
          - signal-service
          - alert-service
          - trade-service
          - backtest-service
          - diagnosis-service
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t suying-${{ matrix.service }} .
