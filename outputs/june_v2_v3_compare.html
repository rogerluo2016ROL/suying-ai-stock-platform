<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>毕师傅 v2 vs v3 6月复利曲线</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1923; color: #e0e0e0; margin: 0; padding: 20px; }
  h2 { text-align: center; color: #4fc3f7; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #90a4ae; font-size: 14px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #1a2332; border-radius: 12px; padding: 20px; }
  .card h3 { margin: 0 0 15px 0; color: #81c784; font-size: 16px; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #263238; }
  .stat .label { color: #90a4ae; }
  .stat .value { font-weight: bold; }
  .up { color: #4caf50; }
  .down { color: #ef5350; }
  .container { width: 100%; height: 500px; }
</style>
</head>
<body>
<h2>毕师傅硬核科技 — v2 vs v3 6月复利曲线对比</h2>
<div class="subtitle">2026-06-01 进场 → 06-18 离场 | 100万起投 | 等权每日调仓</div>

<div class="grid">
  <div class="card">
    <h3>📊 v2 (第一次回测)</h3>
    <div class="stat"><span class="label">最终市值</span><span class="value" style="color:#66bb6a">¥1,104,878</span></div>
    <div class="stat"><span class="label">总收益</span><span class="value up">+10.5%</span></div>
    <div class="stat"><span class="label">交易笔数</span><span class="value">38</span></div>
    <div class="stat"><span class="label">胜率</span><span class="value">52.6%</span></div>
    <div class="stat"><span class="label">均值收益</span><span class="value">+0.61%</span></div>
    <div class="stat"><span class="label">最大回撤</span><span class="value down">-57,525</span></div>
  </div>
  <div class="card">
    <h3>📊 v3 (第二次回测)</h3>
    <div class="stat"><span class="label">最终市值</span><span class="value" style="color:#66bb6a">¥1,123,460</span></div>
    <div class="stat"><span class="label">总收益</span><span class="value up">+12.3%</span></div>
    <div class="stat"><span class="label">交易笔数</span><span class="value">51</span></div>
    <div class="stat"><span class="label">胜率</span><span class="value">64.7%</span></div>
    <div class="stat"><span class="label">均值收益</span><span class="value">+1.59%</span></div>
    <div class="stat"><span class="label">最大回撤</span><span class="value down">-100,079</span></div>
  </div>
</div>

<div class="container" id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));
var dates = ["2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-15", "2026-06-16", "2026-06-17"];
var v2Data = [1032701, 1031643, 1084822, 1063916, 994346, 942475, 1036604, 1033136, 1054794, 1065543, 1078807, 1104878];
var v3Data = [1055315, 1050636, 1070198, 1057566, 1018161, 996850, 899921, 912454, 961907, 1007856, 1051571, 1123460];
var v2Ret = [3.27, -0.1, 5.15, -1.93, -6.54, -5.22, 9.99, -0.33, 2.1, 1.02, 1.24, 2.42];
var v3Ret = [5.53, -0.44, 1.86, -1.18, -3.73, -2.09, -9.72, 1.39, 5.42, 4.78, 4.34, 6.84];

var option = {
  tooltip: {
    trigger: 'axis',
    backgroundColor: 'rgba(20,30,40,0.95)',
    borderColor: '#37474f',
    textStyle: { color: '#e0e0e0' },
    formatter: function(params) {
      var s = '<b>' + params[0].axisValue + '</b><br/>';
      for (var i = 0; i < params.length; i++) {
        var p = params[i];
        if (p.value === null || p.value === undefined || p.value === '-') continue;
        var prefix = p.seriesName === 'v2' ? '🟡' : '🟢';
        s += prefix + ' ' + p.seriesName + ': <b>¥' + p.value.toLocaleString() + '</b>';
        var ret = p.seriesName === 'v2' ? v2Ret[p.dataIndex] : v3Ret[p.dataIndex];
        if (ret != null) s += ' (' + (ret>0?'+':'') + ret.toFixed(2) + '%)';
        s += '<br/>';
      }
      return s;
    }
  },
  legend: {
    data: ['v2 (第一次)', 'v3 (第二次)'],
    textStyle: { color: '#90a4ae' },
    top: 10
  },
  grid: {
    left: '8%',
    right: '5%',
    top: '15%',
    bottom: '8%'
  },
  xAxis: {
    type: 'category',
    data: dates,
    axisLine: { lineStyle: { color: '#37474f' } },
    axisLabel: {
      color: '#90a4ae',
      formatter: function(v) { return v.substring(5); }
    },
    splitLine: { show: false }
  },
  yAxis: {
    type: 'value',
    name: '市值 (元)',
    nameTextStyle: { color: '#90a4ae' },
    axisLabel: {
      color: '#90a4ae',
      formatter: function(v) { return '¥' + (v/10000).toFixed(0) + '万'; }
    },
    splitLine: { lineStyle: { color: '#263238', type: 'dashed' } },
    min: 880000,
    max: 1160000
  },
  series: [
    {
      name: 'v2 (第一次)',
      type: 'line',
      data: v2Data,
      connectNulls: false,
      lineStyle: { color: '#ffb74d', width: 2.5 },
      itemStyle: { color: '#ffb74d' },
      symbol: 'circle',
      symbolSize: 6,
      markLine: {
        silent: true,
        symbol: 'none',
        lineStyle: { color: '#ffb74d', type: 'dashed', width: 1 },
        data: [{ yAxis: 1000000, label: { formatter: '本金线', color: '#ffb74d' } }]
      },
      markPoint: {
        data: [
          { name: '终点', coord: ['2026-06-17', 1104878], value: '¥' + (1104878/10000).toFixed(1) + '万', symbol: 'pin', symbolSize: 40, itemStyle: { color: '#ffb74d' } }
        ]
      }
    },
    {
      name: 'v3 (第二次)',
      type: 'line',
      data: v3Data,
      connectNulls: false,
      lineStyle: { color: '#66bb6a', width: 2.5 },
      itemStyle: { color: '#66bb6a' },
      symbol: 'diamond',
      symbolSize: 7,
      markPoint: {
        data: [
          { name: '最大回撤', coord: ['2026-06-10', 899921], value: '-¥' + Math.abs(899921-1000000)/10000 + '万', symbol: 'triangle', symbolSize: 20, symbolRotate: 180, itemStyle: { color: '#ef5350' } },
          { name: '终点', coord: ['2026-06-17', 1123460], value: '¥' + (1123460/10000).toFixed(1) + '万', symbol: 'pin', symbolSize: 40, itemStyle: { color: '#66bb6a' } }
        ]
      }
    }
  ]
};

chart.setOption(option);
window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
